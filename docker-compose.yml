services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a2a
      POSTGRES_PASSWORD: a2a
      POSTGRES_DB: a2a
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2a"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build: .
    image: a2a-gateway-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://a2a:a2a@postgres:5432/a2a
      REDIS_URL: redis://redis:6379/0
      ADMIN_KEY: dev-only-do-not-use-in-prod
      LOG_LEVEL: info
    ports:
      - "8000:8000"

  # --- demo profile (off by default) ---
  echo:
    image: a2a-gateway-api
    profiles: [demo]
    command: ["python", "-m", "samples.echo.server"]
    depends_on:
      - api
    environment:
      - PORT=8101

  research:
    image: a2a-gateway-api
    profiles: [demo]
    command: ["python", "-m", "samples.research.server"]
    depends_on:
      - api
    environment:
      - PORT=8102

  flaky:
    image: a2a-gateway-api
    profiles: [demo]
    command: ["python", "-m", "samples.flaky.server"]
    depends_on:
      - api
    environment:
      - PORT=8103

  traffic:
    image: a2a-gateway-api
    profiles: [demo]
    command: ["python", "-m", "samples.traffic_loop"]
    depends_on:
      - api
      - echo
      - research
      - flaky
    environment:
      GATEWAY_URL: http://api:8000
      ADMIN_KEY: dev-only-do-not-use-in-prod
      ECHO_URL: http://echo:8101
      RESEARCH_URL: http://research:8102
      FLAKY_URL: http://flaky:8103

volumes:
  pgdata:
